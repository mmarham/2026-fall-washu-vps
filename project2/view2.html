<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: url("media/3.jpg") center / cover no-repeat fixed;
        }

        .dot-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Match the image's cover sizing to keep dots on the openings. */
            width: max(100vw, calc(100vh * 1834 / 1098));
            height: max(100vh, calc(100vw * 1098 / 1834));
            pointer-events: none;
        }

        .dot-hover-area {
            position: absolute;
            top: 50%;
            width: 200px;
            height: 200px;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: black;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .dot-hover-area:hover .dot,
        .dot-hover-area:focus-visible .dot {
            opacity: 1;
        }

        .back-left-dot { left: 47.2%; }
        .next-room-dot { left: 57.2%; }
    </style>
</head>
<body>
    <div class="dot-container">
        <a class="dot-hover-area next-room-dot" href="lobby.html" aria-label="Go to next room on the right">
            <span class="dot" aria-hidden="true"></span>
        </a>
    </div>
</body>
</html>
