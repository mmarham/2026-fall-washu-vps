<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: url("media/30.jpg") center / cover no-repeat fixed;
        }

        .dot-hover-area {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: black;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .dot-hover-area:hover .dot,
        .dot-hover-area:focus-visible .dot {
            opacity: 1;
        }
    </style>
</head>
<body>
    <a class="dot-hover-area" href="31.html" aria-label="Go to view 31">
        <span class="dot" aria-hidden="true"></span>
    </a>
</body>
</html>
