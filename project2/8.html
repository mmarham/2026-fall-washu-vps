<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: url("media/8.jpg") center / cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-container {
            width: 400px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-container h1 {
            text-transform: uppercase;
            color: white;
            font-size: 45px;
            font-family: Helvetica, Arial, sans-serif;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .center-container a {
            color: inherit;
            text-decoration: none;
        }

        .center-container:hover h1,
        .center-container:focus-within h1 {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="center-container">
        <h1><a href="9.html">Enter?</a></h1>
    </div>
</body>
</html>
