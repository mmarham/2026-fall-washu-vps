<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url("media/1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            text-transform: uppercase;
            color: white;
            font-size: 45px;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }

        .center-container {
            width: 400px;
            height: 200px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-container a,
        .center-container a:link,
        .center-container a:visited,
        .center-container a:hover,
        .center-container a:active {
            color: white;
            text-decoration: none;
        }

        .center-container h1 {
            opacity: 0;
            transition: opacity 0.5s ease;

            font-family: Helvetica, Arial, sans-serif;
            text-align: center;
            
        }

        .center-container:hover h1 {
            opacity: 1;
            text-decoration: none;
        }
        
    </style>
</head>
<body>
    <div class="center-container">
        <h1><a href="room1.html">Enter</a></h1>
    </div>
</body>
</html>
