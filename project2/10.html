<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: url("media/10.jpg") center / cover no-repeat fixed;
        }
        .album {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            width: min(750px, 80vw, 70vh);
        }

        .center-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .album figcaption {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            margin-top: 20px;
            color: black;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 45px;
            font-weight: bold;
            text-align: left;
        }

        .music-player {
            position: fixed;
            bottom: 20px;
            left: 20px;
            max-width: calc(100vw - 40px);
        }

        .dot-hover-area {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: black;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .dot-hover-area:hover .dot,
        .dot-hover-area:focus-visible .dot {
            opacity: 1;
        }
    </style>
</head>
<body>
    <figure class="album">
        <img class="center-image" src="media/toe.jpg" alt="Toe">
        <figcaption>GOODBYE - TOE</figcaption>
    </figure>
    <audio class="music-player" controls autoplay loop aria-label="Background music">
        <source src="media/toe - グッドバイ (Album Version).mp3" type="audio/mpeg">
    </audio>
    <a class="dot-hover-area" href="11.html" aria-label="Continue to the next view">
        <span class="dot" aria-hidden="true"></span>
    </a>
</body>
</html>
