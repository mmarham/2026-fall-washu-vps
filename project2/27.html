<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: url("media/27.jpg") center / cover no-repeat fixed;
        }
        .back-link {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 200px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .back-link span {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .back-link:hover span,
        .back-link:focus-visible span {
            opacity: 1;
        }
    </style>
</head>
<body>
    <audio id="ocean-audio" autoplay loop hidden>
        <source src="media/ocean.mp3" type="audio/mpeg">
    </audio>
    <script>
        const oceanAudio = document.getElementById("ocean-audio");
        function startOceanAudio() {
            oceanAudio.play().then(() => {
                document.removeEventListener("pointerdown", startOceanAudio);
                document.removeEventListener("keydown", startOceanAudio);
            }).catch(() => {});
        }
        document.addEventListener("pointerdown", startOceanAudio);
        document.addEventListener("keydown", startOceanAudio);
        startOceanAudio();
    </script>
    <a class="back-link" href="25.html" aria-label="Go back to the previous view"><span aria-hidden="true"></span></a>
</body>
</html>
