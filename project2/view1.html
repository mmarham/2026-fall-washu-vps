<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        body{
            background-image: url("media/2.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .dot-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 200px;
            height: 200px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-dot {
            width: 20px;
            height: 20px;
            background-color: black;
            border-radius: 50%;

            opacity: 0;
            transition: opacity 0.5s ease;

            display: block;
            cursor: pointer;
        }

        .dot-container:hover .center-dot {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="dot-container">
        <a href="view2.html" class="center-dot"></a>
    </div>
</body>
</html>
